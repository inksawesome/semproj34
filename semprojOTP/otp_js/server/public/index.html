<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walk-OTP Generator Visualizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap');
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 350px;
            background: #161b22;
            border-right: 1px solid #30363d;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }
        .main-content {
            flex-grow: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #58a6ff;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 2rem;
        }
        .otp-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.5rem;
            color: #3fb950;
            font-weight: 700;
            letter-spacing: 0.5rem;
            text-align: center;
            text-shadow: 0 0 20px rgba(63,185,80,0.5);
            margin: 2rem 0;
        }
        .status-bar {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            height: 8px;
            margin-top: 1rem;
        }
        .status-fill {
            height: 100%;
            background: #1f6feb;
            width: 100%;
            transition: width 1s linear;
        }
        .info-card {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        .stat-val { font-family: 'JetBrains Mono'; color: #e6edf3; }
        .node-info { position: absolute; top: 2rem; right: 2rem; background: rgba(22,27,34,0.8); padding: 1rem; border-radius: 8px; border: 1px solid #30363d; font-family: monospace; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="title">🖥️ Server Visualizer</div>
            <div class="subtitle">Random-Walk OTP Generation</div>
            
            <div class="info-card">
                <div class="stat-row">
                    <span style="color:#8b949e">Algorithm</span>
                    <span class="stat-val">Graph Walk</span>
                </div>
                <div class="stat-row">
                    <span style="color:#8b949e">Nodes</span>
                    <span class="stat-val" id="nodes-count">64</span>
                </div>
                <div class="stat-row">
                    <span style="color:#8b949e">Walk Steps</span>
                    <span class="stat-val">16</span>
                </div>
                <div class="stat-row">
                    <span style="color:#8b949e">Time Window</span>
                    <span class="stat-val" id="time-window">T = ...</span>
                </div>
            </div>

            <div class="otp-display" id="otp-code">------</div>
            
            <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#8b949e">
                <span>Valid for: <span id="time-rem" style="color:#e6edf3">30s</span></span>
            </div>
            <div class="status-bar">
                <div class="status-fill" id="status-fill"></div>
            </div>
        </div>
        
        <div style="font-size:0.75rem; color:#8b949e">
            The server generates the OTP based on the deterministic graph walk shown on the right.
        </div>
    </div>

    <div class="main-content">
        <div class="node-info" id="node-info">Current Path Length: 0/16</div>
        <canvas id="graphCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        
        let graph = [];
        let nodes = [];
        let currentPath = [];
        let animatedPathIndex = 0;
        let animationFrameId = null;

        // Resize canvas
        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawGraph();
        }
        window.addEventListener('resize', resize);

        // Fetch Graph Data
        async function fetchGraph() {
            const res = await fetch('/api/graph');
            const data = await res.json();
            graph = data.graph;
            document.getElementById('nodes-count').innerText = graph.length;
            calculateNodePositions();
            resize();
        }

        // Calculate circular positions
        function calculateNodePositions() {
            nodes = [];
            const radius = Math.min(canvas.width, canvas.height) * 0.4;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            for (let i = 0; i < graph.length; i++) {
                const angle = (i / graph.length) * Math.PI * 2 - Math.PI / 2;
                nodes.push({
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius
                });
            }
        }

        function drawGraph() {
            if (nodes.length === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw edges
            ctx.strokeStyle = 'rgba(48, 54, 61, 0.4)';
            ctx.lineWidth = 1;
            for (let i = 0; i < graph.length; i++) {
                for (let j of graph[i]) {
                    if (i < j) { // Draw once
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Draw Walk Path (Animated)
            if (currentPath.length > 0) {
                ctx.strokeStyle = 'rgba(31, 111, 235, 0.8)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(nodes[currentPath[0]].x, nodes[currentPath[0]].y);
                for (let i = 1; i <= animatedPathIndex; i++) {
                    ctx.lineTo(nodes[currentPath[i]].x, nodes[currentPath[i]].y);
                }
                ctx.stroke();
            }

            // Draw nodes
            for (let i = 0; i < nodes.length; i++) {
                const isActive = currentPath.slice(0, animatedPathIndex + 1).includes(i);
                const isCurrent = currentPath[animatedPathIndex] === i;
                
                ctx.beginPath();
                ctx.arc(nodes[i].x, nodes[i].y, isActive ? 6 : 4, 0, Math.PI * 2);
                
                if (isCurrent) {
                    ctx.fillStyle = '#58a6ff';
                    ctx.shadowColor = '#58a6ff';
                    ctx.shadowBlur = 15;
                } else if (isActive) {
                    ctx.fillStyle = '#3fb950';
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#8b949e';
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
            }
            ctx.shadowBlur = 0; // reset
        }

        // Animate the path drawing
        function animateWalk() {
            if (animatedPathIndex < currentPath.length - 1) {
                animatedPathIndex++;
                document.getElementById('node-info').innerText = `Path Length: ${animatedPathIndex}/16 (Node ${currentPath[animatedPathIndex]})`;
                drawGraph();
                setTimeout(animateWalk, 100);
            }
        }

        async function fetchOTP() {
            try {
                const res = await fetch('/api/otp/current');
                const data = await res.json();
                
                document.getElementById('time-window').innerText = `T = ${data.counter}`;
                document.getElementById('otp-code').innerText = data.otp;
                
                const percent = (data.timeRemaining / data.timeStep) * 100;
                document.getElementById('status-fill').style.width = `${percent}%`;
                document.getElementById('time-rem').innerText = `${data.timeRemaining}s`;

                // If path changed (new time window), restart animation
                if (JSON.stringify(data.path) !== JSON.stringify(currentPath)) {
                    currentPath = data.path;
                    animatedPathIndex = 0;
                    document.getElementById('node-info').innerText = `Path Length: 0/16 (Node ${currentPath[0]})`;
                    animateWalk();
                }

            } catch (e) {
                console.error(e);
            }
        }

        // Init
        fetchGraph().then(() => {
            fetchOTP();
            setInterval(fetchOTP, 1000);
        });

    </script>
</body>
</html>
